<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚽ 간편 축구 — 멀티플레이</title>
<meta name="description" content="친구와 바로 즐기는 웹 멀티플레이 축구 게임. 설치 없이 방 코드만 공유하세요.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
  :root {
    --bg: #0d1f12;
    --panel: #14281a;
    --panel2: #1b3523;
    --line: rgba(255,255,255,.12);
    --text: #eaf5ec;
    --muted: #9fbfa8;
    --red: #e55b5b;
    --blue: #5b8de5;
    --accent: #43d17c;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
    touch-action:none;
  }

  /* ===== 로비 ===== */
  #lobby {
    position:fixed; inset:0; z-index:30;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at 50% 30%, #16341f 0%, var(--bg) 70%);
    padding:16px;
  }
  .card {
    width:100%; max-width:420px;
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:28px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .card h1 { font-size:28px; text-align:center; margin-bottom:4px; }
  .card .sub { text-align:center; color:var(--muted); font-size:13px; margin-bottom:22px; }
  .field-label { font-size:12px; color:var(--muted); margin:14px 0 6px; }
  input[type=text] {
    width:100%; padding:12px 14px; font-size:16px;
    background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:10px; outline:none;
  }
  input[type=text]:focus { border-color:var(--accent); }
  .btn {
    width:100%; padding:13px; margin-top:10px;
    font-size:16px; font-weight:700; cursor:pointer;
    border:none; border-radius:10px; color:#06220f;
    background:var(--accent); transition:filter .15s;
  }
  .btn:hover { filter:brightness(1.1); }
  .btn.ghost { background:var(--panel2); color:var(--text); border:1px solid var(--line); }
  .btn:disabled { opacity:.5; cursor:default; }
  .divider { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; margin:18px 0 8px; }
  .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--line); }
  #lobbyStatus { margin-top:14px; font-size:13px; color:var(--muted); text-align:center; min-height:18px; }
  #lobbyStatus.err { color:#ff8a8a; }

  /* ===== 게임 화면 ===== */
  #game { position:fixed; inset:0; display:none; flex-direction:column; }
  #topbar {
    display:flex; align-items:center; justify-content:center; gap:14px;
    padding:8px 12px; flex-wrap:wrap;
  }
  .scorebox {
    display:flex; align-items:center; gap:10px;
    background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:6px 16px; font-weight:800; font-size:20px;
  }
  .scorebox .t-red { color:var(--red); }
  .scorebox .t-blue { color:var(--blue); }
  .scorebox #clock { font-size:14px; color:var(--muted); font-weight:600; min-width:44px; text-align:center; }
  .roombox {
    display:flex; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:6px 12px; font-size:13px; color:var(--muted);
  }
  .roombox b { color:var(--accent); font-size:16px; letter-spacing:2px; }
  .mini { padding:5px 10px; font-size:12px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); cursor:pointer; }
  .mini:hover { border-color:var(--accent); }
  #canvasWrap { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; padding:4px 8px 8px; }
  canvas { max-width:100%; max-height:100%; border-radius:10px; }
  #help { text-align:center; font-size:12px; color:var(--muted); padding:0 10px 8px; }

  /* ===== 모바일 컨트롤 ===== */
  #stick {
    position:fixed; left:0; bottom:0; width:50%; height:55%; z-index:20; display:none;
  }
  #kickBtn {
    position:fixed; right:18px; bottom:28px; z-index:20; display:none;
    width:84px; height:84px; border-radius:50%;
    background:rgba(229,91,91,.25); border:2px solid rgba(229,91,91,.7);
    color:#fff; font-size:15px; font-weight:800;
  }
  #stickBase, #stickKnob {
    position:fixed; border-radius:50%; pointer-events:none; z-index:21; display:none;
  }
  #stickBase { width:110px; height:110px; border:2px solid rgba(255,255,255,.25); background:rgba(255,255,255,.05); }
  #stickKnob { width:48px; height:48px; background:rgba(255,255,255,.35); }
  @media (pointer:coarse) {
    #stick, #kickBtn { display:block; }
    #help { display:none; }
  }

  /* 토스트 */
  #toast {
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    background:#000c; color:#fff; padding:10px 18px; border-radius:10px;
    font-size:14px; z-index:40; display:none;
  }
</style>
</head>
<body>

<!-- ===================== 로비 ===================== -->
<div id="lobby">
  <div class="card">
    <h1>⚽ 간편 축구</h1>
    <div class="sub">설치 없이 브라우저로 즐기는 멀티플레이 축구 (헥스볼 스타일)</div>

    <div class="field-label">닉네임</div>
    <input type="text" id="nickname" maxlength="10" placeholder="예: 손흥민" autocomplete="off">

    <button class="btn" id="btnHost">🏠 방 만들기</button>

    <div class="divider">또는 친구 방에 참가</div>
    <input type="text" id="joinCode" maxlength="6" placeholder="방 코드 입력 (예: AB3D)" autocomplete="off" style="text-transform:uppercase; letter-spacing:3px; text-align:center;">
    <button class="btn ghost" id="btnJoin">🚪 참가하기</button>

    <div id="lobbyStatus"></div>
  </div>
</div>

<!-- ===================== 게임 ===================== -->
<div id="game">
  <div id="topbar">
    <div class="scorebox">
      <span class="t-red" id="scoreRed">0</span>
      <span id="clock">00:00</span>
      <span class="t-blue" id="scoreBlue">0</span>
    </div>
    <div class="roombox">
      방 코드 <b id="roomCode">----</b>
      <button class="mini" id="btnCopy">복사</button>
      <button class="mini" id="btnInvite">초대 링크</button>
      <button class="mini" id="btnBot" style="display:none">🤖 봇 추가</button>
      <button class="mini" id="btnReset" style="display:none">↺ 리셋</button>
    </div>
  </div>
  <div id="canvasWrap"><canvas id="cv" width="1300" height="700"></canvas></div>
  <div id="help">이동: <b>WASD / 방향키</b> · 킥: <b>Space 또는 X</b> (잡고 있으면 차지 표시) · 호스트 리셋: <b>R</b></div>
</div>

<div id="stick"></div>
<button id="kickBtn">KICK</button>
<div id="stickBase"></div>
<div id="stickKnob"></div>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================
 * 간편 축구 — 헥스볼 스타일 P2P 멀티플레이
 *  - 호스트가 물리 시뮬레이션을 돌리는 권위 서버 역할
 *  - 게스트는 입력만 전송, 상태 스냅샷을 받아 렌더링
 *  - PeerJS 공개 브로커 사용 → 별도 서버 없이 정적 배포 가능
 * ========================================================= */

// ---------- 상수 ----------
const W = 1300, H = 700;               // 캔버스 논리 크기
const FX = 50, FY = 50, FW = 1200, FH = 600; // 필드 영역
const CX = FX + FW/2, CY = FY + FH/2;  // 센터
const GOAL_H = 220, GOAL_DEPTH = 42;   // 골대 높이/깊이
const GOAL_TOP = CY - GOAL_H/2, GOAL_BOT = CY + GOAL_H/2;
const P_R = 16, B_R = 10;              // 플레이어/공 반지름
const P_ACCEL = 0.27, P_DAMP = 0.96;
const B_DAMP = 0.992, WALL_BOUNCE = 0.85;
const KICK_RANGE = 6, KICK_POWER = 9.5;
const TICK = 1000/60;
const SNAP_EVERY = 2;                  // 2틱마다 스냅샷 전송(30Hz)
const ID_PREFIX = 'hxkr-soccer-';

// ---------- 전역 상태 ----------
let peer = null;
let isHost = false;
let myId = null;              // 게임 내 플레이어 id
let roomCode = '';
let conns = new Map();        // host: peerConnId -> {conn, playerId}
let hostConn = null;          // guest: 호스트와의 연결

// 호스트 시뮬레이션 상태
const sim = {
  players: new Map(),  // id -> {id,name,team,x,y,vx,vy,input:{up,down,left,right,kick},bot}
  ball: { x: CX, y: CY, vx: 0, vy: 0 },
  score: [0, 0],       // [red, blue]
  time: 0,             // 초
  freeze: 0,           // 골 연출 등 정지 틱 수
  msg: '', msgTtl: 0,
  nextId: 1,
};

// 게스트 렌더 상태 (스냅샷 보간)
let snapA = null, snapB = null, snapBTime = 0;

// 내 입력
const input = { up:false, down:false, left:false, right:false, kick:false };
let lastSentInput = '';

// ---------- DOM ----------
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
const lobbyStatus = $('#lobbyStatus');

function toast(msg, ms=2500) {
  const t = $('#toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._tm); t._tm = setTimeout(() => t.style.display='none', ms);
}
function setStatus(msg, err=false) {
  lobbyStatus.textContent = msg;
  lobbyStatus.className = err ? 'err' : '';
}

// ---------- 유틸 ----------
function genCode() {
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // 혼동 문자 제외
  let c = '';
  for (let i=0;i<4;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function clamp(v,a,b){ return v<a?a:v>b?b:v; }

// ---------- 로비 ----------
const savedName = localStorage.getItem('soccer_nick') || '';
$('#nickname').value = savedName;

// 초대 링크로 접속한 경우 코드 자동 입력
const urlRoom = new URLSearchParams(location.search).get('room');
if (urlRoom) $('#joinCode').value = urlRoom.toUpperCase();

function getNick() {
  const n = $('#nickname').value.trim() || '플레이어';
  localStorage.setItem('soccer_nick', n);
  return n;
}

$('#btnHost').onclick = () => startHost(getNick());
$('#btnJoin').onclick = () => {
  const code = $('#joinCode').value.trim().toUpperCase();
  if (code.length < 4) return setStatus('방 코드 4자리를 입력하세요', true);
  startGuest(getNick(), code);
};
$('#joinCode').addEventListener('keydown', e => { if (e.key==='Enter') $('#btnJoin').click(); });

function lockLobby(lock) {
  $('#btnHost').disabled = lock;
  $('#btnJoin').disabled = lock;
}

// ---------- 호스트 ----------
function startHost(nick, retry=0) {
  lockLobby(true);
  roomCode = genCode();
  setStatus('방 생성 중…');
  peer = new Peer(ID_PREFIX + roomCode, { debug: 1 });

  peer.on('open', () => {
    isHost = true;
    myId = 'p0';
    addPlayer(myId, nick, false);
    enterGame();
  });

  peer.on('connection', conn => {
    conn.on('open', () => {
      conn.on('data', d => onHostData(conn, d));
      conn.on('close', () => dropGuest(conn));
      conn.on('error', () => dropGuest(conn));
    });
  });

  peer.on('error', err => {
    if (err.type === 'unavailable-id' && retry < 5) {
      peer.destroy();
      startHost(nick, retry+1); // 코드 충돌 → 재생성
      return;
    }
    setStatus('연결 실패: ' + err.type + ' (네트워크 확인 후 다시 시도)', true);
    lockLobby(false);
  });
}

function addPlayer(id, name, bot) {
  // 팀 밸런스: 인원 적은 쪽으로
  let red = 0, blue = 0;
  sim.players.forEach(p => p.team === 0 ? red++ : blue++);
  const team = red <= blue ? 0 : 1;
  const p = {
    id, name: (name||'플레이어').slice(0,10), team, bot: !!bot,
    x:0, y:0, vx:0, vy:0,
    input: { up:false,down:false,left:false,right:false,kick:false },
  };
  sim.players.set(id, p);
  placePlayer(p);
  return p;
}

function placePlayer(p) {
  // 팀별 진영에 세로로 분산 배치
  const teammates = [...sim.players.values()].filter(q => q.team === p.team);
  const idx = teammates.indexOf(p);
  const n = teammates.length;
  p.x = p.team === 0 ? FX + FW*0.25 : FX + FW*0.75;
  p.y = CY + (idx - (n-1)/2) * 70;
  p.vx = p.vy = 0;
}

function kickoffReset() {
  sim.ball.x = CX; sim.ball.y = CY; sim.ball.vx = 0; sim.ball.vy = 0;
  sim.players.forEach(placePlayer);
}

function onHostData(conn, d) {
  if (!d || typeof d !== 'object') return;
  if (d.t === 'join') {
    const p = addPlayer('p' + (sim.nextId++), String(d.name||''), false);
    conns.set(conn.peer, { conn, playerId: p.id });
    conn.send({ t:'welcome', id: p.id, room: roomCode });
    announce(`${p.name} 입장! (${p.team===0?'🔴레드':'🔵블루'})`);
  } else if (d.t === 'input') {
    const rec = conns.get(conn.peer);
    if (!rec) return;
    const p = sim.players.get(rec.playerId);
    if (!p) return;
    p.input.up = !!d.u; p.input.down = !!d.d;
    p.input.left = !!d.l; p.input.right = !!d.r;
    p.input.kick = !!d.k;
  }
}

function dropGuest(conn) {
  const rec = conns.get(conn.peer);
  if (!rec) return;
  const p = sim.players.get(rec.playerId);
  conns.delete(conn.peer);
  if (p) {
    sim.players.delete(p.id);
    announce(`${p.name} 퇴장`);
  }
}

function announce(msg) {
  sim.msg = msg; sim.msgTtl = 150;
}

function broadcast(data) {
  conns.forEach(rec => { try { rec.conn.send(data); } catch(e){} });
}

// ---------- 게스트 ----------
function startGuest(nick, code) {
  lockLobby(true);
  setStatus('방에 연결 중…');
  roomCode = code;
  peer = new Peer({ debug: 1 });

  peer.on('open', () => {
    hostConn = peer.connect(ID_PREFIX + code, { reliable: true });
    const failTm = setTimeout(() => {
      setStatus('방을 찾을 수 없습니다. 코드를 확인하세요.', true);
      lockLobby(false);
      try { peer.destroy(); } catch(e){}
    }, 8000);

    hostConn.on('open', () => {
      hostConn.send({ t:'join', name: nick });
    });
    hostConn.on('data', d => {
      if (!d || typeof d !== 'object') return;
      if (d.t === 'welcome') {
        clearTimeout(failTm);
        isHost = false;
        myId = d.id;
        enterGame();
      } else if (d.t === 'snap') {
        snapA = snapB;
        snapB = d.s;
        snapBTime = performance.now();
      }
    });
    hostConn.on('close', () => {
      toast('호스트와 연결이 끊어졌습니다', 4000);
      setTimeout(() => location.reload(), 2500);
    });
  });

  peer.on('error', err => {
    if (err.type === 'peer-unavailable') {
      setStatus('방을 찾을 수 없습니다. 코드를 확인하세요.', true);
    } else {
      setStatus('연결 오류: ' + err.type, true);
    }
    lockLobby(false);
  });
}

// ---------- 게임 진입 ----------
function enterGame() {
  $('#lobby').style.display = 'none';
  $('#game').style.display = 'flex';
  $('#roomCode').textContent = roomCode;
  if (isHost) {
    $('#btnReset').style.display = '';
    $('#btnBot').style.display = '';
  }
  requestAnimationFrame(frame);
  if (isHost) toast('친구에게 방 코드를 공유하세요: ' + roomCode, 4000);
}

$('#btnCopy').onclick = () => {
  navigator.clipboard?.writeText(roomCode).then(() => toast('방 코드 복사됨: ' + roomCode));
};
$('#btnInvite').onclick = () => {
  const url = location.origin + location.pathname + '?room=' + roomCode;
  navigator.clipboard?.writeText(url).then(() => toast('초대 링크 복사됨!'));
};
$('#btnReset').onclick = () => { if (isHost) resetMatch(); };
$('#btnBot').onclick = () => {
  if (!isHost) return;
  let bots = 0; sim.players.forEach(p => p.bot && bots++);
  if (bots >= 4) return toast('봇은 최대 4개까지');
  addPlayer('bot' + Math.random().toString(36).slice(2,6), '🤖봇', true);
  announce('🤖 봇 입장!');
};

function resetMatch() {
  sim.score = [0,0]; sim.time = 0;
  kickoffReset();
  announce('경기 리셋! ⚽');
}

// ---------- 입력 ----------
const KEYMAP = {
  'ArrowUp':'up','KeyW':'up',
  'ArrowDown':'down','KeyS':'down',
  'ArrowLeft':'left','KeyA':'left',
  'ArrowRight':'right','KeyD':'right',
  'Space':'kick','KeyX':'kick',
};
window.addEventListener('keydown', e => {
  if (e.code === 'KeyR' && isHost) { resetMatch(); return; }
  const k = KEYMAP[e.code];
  if (k) { input[k] = true; e.preventDefault(); }
});
window.addEventListener('keyup', e => {
  const k = KEYMAP[e.code];
  if (k) { input[k] = false; e.preventDefault(); }
});

// 모바일: 가상 조이스틱 + 킥 버튼
(function setupTouch() {
  const stick = $('#stick'), base = $('#stickBase'), knob = $('#stickKnob');
  let origin = null, touchId = null;
  const RANGE = 55;

  stick.addEventListener('touchstart', e => {
    const t = e.changedTouches[0];
    touchId = t.identifier;
    origin = { x: t.clientX, y: t.clientY };
    base.style.display = knob.style.display = 'block';
    base.style.left = (origin.x-55)+'px'; base.style.top = (origin.y-55)+'px';
    knob.style.left = (origin.x-24)+'px'; knob.style.top = (origin.y-24)+'px';
    e.preventDefault();
  }, {passive:false});

  stick.addEventListener('touchmove', e => {
    for (const t of e.changedTouches) {
      if (t.identifier !== touchId || !origin) continue;
      let dx = t.clientX - origin.x, dy = t.clientY - origin.y;
      const len = Math.hypot(dx,dy);
      if (len > RANGE) { dx = dx/len*RANGE; dy = dy/len*RANGE; }
      knob.style.left = (origin.x+dx-24)+'px'; knob.style.top = (origin.y+dy-24)+'px';
      const dead = 12;
      input.left = dx < -dead; input.right = dx > dead;
      input.up = dy < -dead; input.down = dy > dead;
    }
    e.preventDefault();
  }, {passive:false});

  const endStick = e => {
    for (const t of e.changedTouches) {
      if (t.identifier !== touchId) continue;
      touchId = null; origin = null;
      base.style.display = knob.style.display = 'none';
      input.left = input.right = input.up = input.down = false;
    }
  };
  stick.addEventListener('touchend', endStick);
  stick.addEventListener('touchcancel', endStick);

  const kb = $('#kickBtn');
  kb.addEventListener('touchstart', e => { input.kick = true; e.preventDefault(); }, {passive:false});
  kb.addEventListener('touchend', e => { input.kick = false; e.preventDefault(); }, {passive:false});
})();

// ---------- 물리 (호스트 전용) ----------
function simTick() {
  sim.time += 1/60;
  if (sim.msgTtl > 0) sim.msgTtl--;
  if (sim.freeze > 0) { sim.freeze--; if (sim.freeze === 0) kickoffReset(); return; }

  // 내(호스트) 입력 반영
  const me = sim.players.get(myId);
  if (me) me.input = { ...input };

  // 봇 AI: 공을 향해 이동, 공 뒤쪽으로 돌아가서 상대 골대 방향으로 킥
  sim.players.forEach(p => {
    if (!p.bot) return;
    const b = sim.ball;
    const goalX = p.team === 0 ? FX + FW : FX; // 상대 골대
    // 공 뒤편 목표 지점 (공 기준 자기 골대 쪽으로 약간)
    const dirToGoal = Math.atan2(CY - b.y, goalX - b.x);
    const tx = b.x - Math.cos(dirToGoal) * 25;
    const ty = b.y - Math.sin(dirToGoal) * 25;
    const dx = tx - p.x, dy = ty - p.y;
    const dist = Math.hypot(dx, dy);
    p.input.left = dx < -6; p.input.right = dx > 6;
    p.input.up = dy < -6; p.input.down = dy > 6;
    const distBall = Math.hypot(b.x - p.x, b.y - p.y);
    p.input.kick = distBall < P_R + B_R + KICK_RANGE + 4 && dist < 40;
  });

  // 플레이어 이동
  sim.players.forEach(p => {
    let ax = (p.input.right?1:0) - (p.input.left?1:0);
    let ay = (p.input.down?1:0) - (p.input.up?1:0);
    if (ax || ay) {
      const len = Math.hypot(ax, ay);
      // 킥 준비 중엔 살짝 느리게 (헥스볼 느낌)
      const acc = p.input.kick ? P_ACCEL*0.8 : P_ACCEL;
      p.vx += ax/len*acc; p.vy += ay/len*acc;
    }
    p.vx *= P_DAMP; p.vy *= P_DAMP;
    p.x += p.vx; p.y += p.vy;
    // 캔버스 가장자리(필드 밖 마진 포함)에서 제한
    p.x = clamp(p.x, P_R+4, W-P_R-4);
    p.y = clamp(p.y, P_R+4, H-P_R-4);
  });

  // 플레이어끼리 충돌
  const arr = [...sim.players.values()];
  for (let i=0;i<arr.length;i++) for (let j=i+1;j<arr.length;j++) {
    const a = arr[i], b = arr[j];
    const dx = b.x-a.x, dy = b.y-a.y;
    const d = Math.hypot(dx,dy), min = P_R*2;
    if (d > 0 && d < min) {
      const nx = dx/d, ny = dy/d, push = (min-d)/2;
      a.x -= nx*push; a.y -= ny*push;
      b.x += nx*push; b.y += ny*push;
      const rvn = (b.vx-a.vx)*nx + (b.vy-a.vy)*ny;
      if (rvn < 0) {
        const imp = -rvn*0.5;
        a.vx -= nx*imp; a.vy -= ny*imp;
        b.vx += nx*imp; b.vy += ny*imp;
      }
    }
  }

  // 공 이동
  const ball = sim.ball;
  ball.x += ball.vx; ball.y += ball.vy;
  ball.vx *= B_DAMP; ball.vy *= B_DAMP;

  // 공-플레이어 충돌 + 킥
  sim.players.forEach(p => {
    const dx = ball.x-p.x, dy = ball.y-p.y;
    const d = Math.hypot(dx,dy), min = P_R+B_R;
    if (d > 0 && d < min) {
      const nx = dx/d, ny = dy/d;
      ball.x = p.x + nx*min; ball.y = p.y + ny*min;
      const rvn = (ball.vx-p.vx)*nx + (ball.vy-p.vy)*ny;
      if (rvn < 0) {
        ball.vx -= nx*rvn*1.3; ball.vy -= ny*rvn*1.3;
        ball.vx += p.vx*0.3; ball.vy += p.vy*0.3;
      }
    }
    // 킥: 사거리 내에서 kick 입력 시 공에 임펄스
    if (p.input.kick && d < min + KICK_RANGE) {
      const nx = dx/(d||1), ny = dy/(d||1);
      ball.vx = nx*KICK_POWER + p.vx*0.4;
      ball.vy = ny*KICK_POWER + p.vy*0.4;
      p.input.kick = false; // 1회성 (다시 눌러야 함)
      if (p.id === myId) input.kick = false;
    }
  });

  // 공 벽 충돌 (골문 구간은 통과)
  const inMouth = ball.y > GOAL_TOP + B_R && ball.y < GOAL_BOT - B_R;
  if (ball.y < FY + B_R) { ball.y = FY + B_R; ball.vy = Math.abs(ball.vy)*WALL_BOUNCE; }
  if (ball.y > FY+FH - B_R) { ball.y = FY+FH - B_R; ball.vy = -Math.abs(ball.vy)*WALL_BOUNCE; }
  if (!inMouth) {
    if (ball.x < FX + B_R) { ball.x = FX + B_R; ball.vx = Math.abs(ball.vx)*WALL_BOUNCE; }
    if (ball.x > FX+FW - B_R) { ball.x = FX+FW - B_R; ball.vx = -Math.abs(ball.vx)*WALL_BOUNCE; }
  } else {
    // 골 판정: 공이 골라인을 완전히 넘으면
    if (ball.x < FX - B_R) return goal(1);      // 왼쪽 골 → 블루 득점
    if (ball.x > FX+FW + B_R) return goal(0);   // 오른쪽 골 → 레드 득점
    // 골대 뒷벽/옆벽
    if (ball.x < FX - GOAL_DEPTH + B_R) { ball.x = FX - GOAL_DEPTH + B_R; ball.vx = Math.abs(ball.vx)*WALL_BOUNCE; }
    if (ball.x > FX+FW + GOAL_DEPTH - B_R) { ball.x = FX+FW + GOAL_DEPTH - B_R; ball.vx = -Math.abs(ball.vx)*WALL_BOUNCE; }
  }
}

function goal(team) {
  sim.score[team]++;
  sim.freeze = 120; // 2초 정지 후 킥오프
  announce(team === 0 ? '⚽ GOAL! 🔴 레드 득점!' : '⚽ GOAL! 🔵 블루 득점!');
}

// ---------- 스냅샷 ----------
function makeSnapshot() {
  return {
    p: [...sim.players.values()].map(p => ({
      i: p.id, n: p.name, t: p.team, b: p.bot ? 1 : 0,
      x: +p.x.toFixed(1), y: +p.y.toFixed(1),
      k: p.input.kick ? 1 : 0,
    })),
    b: { x: +sim.ball.x.toFixed(1), y: +sim.ball.y.toFixed(1) },
    s: sim.score, tm: Math.floor(sim.time),
    m: sim.msgTtl > 0 ? sim.msg : '',
    f: sim.freeze > 0 ? 1 : 0,
  };
}

// ---------- 메인 루프 ----------
let acc = 0, lastT = 0, tickCount = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (!lastT) lastT = t;
  let dt = t - lastT; lastT = t;
  if (dt > 250) dt = 250;

  if (isHost) {
    acc += dt;
    while (acc >= TICK) {
      acc -= TICK;
      simTick();
      if (++tickCount % SNAP_EVERY === 0) {
        const s = makeSnapshot();
        broadcast({ t:'snap', s });
        snapA = snapB; snapB = s; snapBTime = performance.now();
      }
    }
  } else {
    // 게스트: 입력 전송 (변화 시 즉시 + 50ms마다 keepalive)
    const cur = JSON.stringify([input.up,input.down,input.left,input.right,input.kick]);
    if (hostConn?.open && (cur !== lastSentInput || t - (frame._lastSend||0) > 50)) {
      hostConn.send({ t:'input', u:input.up, d:input.down, l:input.left, r:input.right, k:input.kick });
      lastSentInput = cur;
      frame._lastSend = t;
    }
  }

  render();
}

// ---------- 렌더 ----------
function render() {
  // 표시할 상태 결정: 호스트는 sim 직접, 게스트는 스냅샷 보간
  let state;
  if (isHost) {
    state = makeSnapshot();
  } else if (snapB) {
    if (snapA) {
      const alpha = clamp((performance.now() - snapBTime) / (TICK*SNAP_EVERY), 0, 1);
      state = {
        ...snapB,
        p: snapB.p.map(pb => {
          const pa = snapA.p.find(q => q.i === pb.i) || pb;
          return { ...pb, x: pa.x + (pb.x-pa.x)*alpha, y: pa.y + (pb.y-pa.y)*alpha };
        }),
        b: {
          x: snapA.b.x + (snapB.b.x - snapA.b.x)*alpha,
          y: snapA.b.y + (snapB.b.y - snapA.b.y)*alpha,
        },
      };
    } else state = snapB;
  } else {
    return; // 아직 데이터 없음
  }

  // HUD
  $('#scoreRed').textContent = state.s[0];
  $('#scoreBlue').textContent = state.s[1];
  const mm = String(Math.floor(state.tm/60)).padStart(2,'0');
  const ss = String(state.tm%60).padStart(2,'0');
  $('#clock').textContent = mm + ':' + ss;

  // 배경
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#0d1f12';
  ctx.fillRect(0,0,W,H);

  // 잔디 스트라이프
  for (let i=0;i<8;i++) {
    ctx.fillStyle = i%2 ? '#2c7a43' : '#2f844a';
    ctx.fillRect(FX + i*FW/8, FY, FW/8, FH);
  }

  // 라인
  ctx.strokeStyle = 'rgba(255,255,255,.75)';
  ctx.lineWidth = 3;
  ctx.strokeRect(FX, FY, FW, FH);
  ctx.beginPath(); ctx.moveTo(CX, FY); ctx.lineTo(CX, FY+FH); ctx.stroke();
  ctx.beginPath(); ctx.arc(CX, CY, 80, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(CX, CY, 4, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fill();
  // 페널티 박스
  ctx.strokeRect(FX, CY-140, 130, 280);
  ctx.strokeRect(FX+FW-130, CY-140, 130, 280);

  // 골대
  ctx.fillStyle = 'rgba(255,255,255,.1)';
  ctx.fillRect(FX-GOAL_DEPTH, GOAL_TOP, GOAL_DEPTH, GOAL_H);
  ctx.fillRect(FX+FW, GOAL_TOP, GOAL_DEPTH, GOAL_H);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
  ctx.strokeRect(FX-GOAL_DEPTH, GOAL_TOP, GOAL_DEPTH, GOAL_H);
  ctx.strokeRect(FX+FW, GOAL_TOP, GOAL_DEPTH, GOAL_H);
  // 골포스트 점
  ctx.fillStyle = '#fff';
  for (const [gx,gy] of [[FX,GOAL_TOP],[FX,GOAL_BOT],[FX+FW,GOAL_TOP],[FX+FW,GOAL_BOT]]) {
    ctx.beginPath(); ctx.arc(gx,gy,6,0,Math.PI*2); ctx.fill();
  }

  // 공
  const b = state.b;
  ctx.beginPath(); ctx.arc(b.x, b.y, B_R, 0, Math.PI*2);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = '#222'; ctx.stroke();

  // 플레이어
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'center';
  for (const p of state.p) {
    ctx.beginPath(); ctx.arc(p.x, p.y, P_R, 0, Math.PI*2);
    ctx.fillStyle = p.t === 0 ? '#e55b5b' : '#5b8de5';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = p.k ? '#fff' : 'rgba(0,0,0,.45)'; // 킥 준비 = 흰 테두리
    ctx.stroke();
    if (p.i === myId) { // 내 캐릭터 표시
      ctx.beginPath(); ctx.arc(p.x, p.y, P_R+5, 0, Math.PI*2);
      ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(67,209,124,.9)'; ctx.stroke();
    }
    ctx.fillStyle = '#fff';
    ctx.fillText(p.n, p.x, p.y - P_R - 8);
  }

  // 메시지
  if (state.m) {
    ctx.font = 'bold 42px sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    const tw = ctx.measureText(state.m).width;
    ctx.fillRect(CX - tw/2 - 24, 120, tw + 48, 64);
    ctx.fillStyle = '#fff';
    ctx.fillText(state.m, CX, 165);
  }
}

// 초기 캔버스 크기 보정
function fitCanvas() {
  const wrap = $('#canvasWrap');
  const r = Math.min(wrap.clientWidth / W, wrap.clientHeight / H);
  cv.style.width = (W*r) + 'px';
  cv.style.height = (H*r) + 'px';
}
window.addEventListener('resize', fitCanvas);
new ResizeObserver(fitCanvas).observe($('#canvasWrap'));
</script>
